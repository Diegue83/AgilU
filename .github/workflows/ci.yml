name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

permissions:
  contents: read

jobs:
  flutter:
    name: Análisis y pruebas de Flutter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true
      # firebase_options.dart no se versiona; para compilar se usa el
      # ejemplo con valores ficticios. Las pruebas no se conectan a Firebase.
      - run: cp tool/firebase_options.ejemplo.dart lib/firebase_options.dart
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  permisos:
    name: Pruebas de permisos en SQL Connect (emulador)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install -g firebase-tools@15
      - run: npm ci
        working-directory: functions
      - run: npm ci
        working-directory: test_dataconnect
      - run: npm test
        working-directory: test_dataconnect

  dependencias:
    name: Revisión de dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: npm audit de Cloud Functions (dependencias de producción)
        run: npm audit --omit=dev --audit-level=high
        working-directory: functions
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true
      - name: Paquetes de Flutter desactualizados (informativo)
        run: flutter pub outdated
        continue-on-error: true
