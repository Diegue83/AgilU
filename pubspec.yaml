name: agilu
description: ÁgilU - App móvil para pre-ordenar alimentos en cafeterías universitarias.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  firebase_data_connect: ^0.4.1
  image_picker: ^1.2.4
  cloud_functions: ^7.0.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.5.0
  firebase_messaging: 17.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
