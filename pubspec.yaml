name: agilu
description: ÁgilU - App móvil para pre-ordenar alimentos en cafeterías universitarias.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_data_connect: ^0.1.5+4
  image_picker: ^1.2.4
  cloud_functions: ^5.6.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.5.0
  firebase_messaging: 15.2.10
  storage_client: ^2.8.1
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
