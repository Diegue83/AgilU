type Autenticacion @table(key: "firebaseAuthUid") {
  firebaseAuthUid: String! @default(expr: "auth.uid")
  correoElectronico: String!
  usuario: Usuario! @unique
}

type Usuario @table {
  nombre: String!
  numeroDeTelefono: String
  direccion: String
  rol: Rol
}

type Rol @table {
  nombre: String!
  descripcion: String
}

type Permiso @table {
  nombre: String!
  codigoAccion: String! @unique
}

type RolPermiso @table(key: ["rol", "permiso"]) {
  rol: Rol!
  permiso: Permiso!
}

type Puesto @table {
  nombre: String!
  ubicacion: String!
}

type Producto @table {
  nombre: String!
  precio: Float!
  cantidadEnStock: Int!
  descripcion: String
  urlDeImagen: String
  categoria: String! @default(value: "General")
  disponible: Boolean! @default(value: true)
  puesto: Puesto!
}

type Pedido @table {
  folio: Int! @unique
  montoTotal: Float!
  estado: String! @default(value: "pendiente")
  fechaCreacion: Timestamp! @default(expr: "request.time")
  recogerA: Timestamp!
  notas: String
  esCredito: Boolean! @default(value: false)
  usuario: Usuario!
  puesto: Puesto!
}

type ContadorFolio @table(key: "nombre") {
  nombre: String!
  valor: Int!
}

type DetallePedido @table {
  cantidad: Int!
  precioEnElMomento: Float!
  pedido: Pedido!
  producto: Producto!
}

type Adeudo @table {
  montoPendiente: Float!
  fechaUltimaActualizacion: Timestamp!
  usuario: Usuario! @unique
}

type Pago @table {
  montoPagado: Float!
  fechaPago: Timestamp!
  usuario: Usuario!
  pedido: Pedido
}

type CarritoItem @table {
  cantidad: Int!
  precioEnElMomento: Float!
  usuario: Usuario!
  producto: Producto!
}

type DispositivoToken @table {
  token: String!
  plataforma: String!
  usuario: Usuario!
}

type Notificacion @table {
  titulo: String!
  mensaje: String!
  fechaEnvio: Timestamp!
  leido: Boolean!
  usuario: Usuario!
}
