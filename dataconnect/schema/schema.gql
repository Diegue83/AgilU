type Autenticacion @table(key: "firebaseAuthUid") {
  firebaseAuthUid: String! @default(expr: "auth.uid")
  correoElectronico: String!
  usuario: Usuario! @unique
}

type Usuario @table {
  nombre: String!
  numeroDeTelefono: String
  direccion: String
  rol: Rol
  cafeteria: Cafeteria
}

# alumno, empleado, encargado, beneficiaria, admin. Todo registro nuevo es
# alumno; un usuario sin rol (cuentas anteriores) también se trata como alumno.
type Rol @table {
  nombre: String! @unique
  descripcion: String
}

type Permiso @table {
  nombre: String!
  codigoAccion: String! @unique
}

type RolPermiso @table(key: ["rol", "permiso"]) {
  rol: Rol!
  permiso: Permiso!
}

type Cafeteria @table {
  nombre: String!
  ubicacion: String
  aperturaMinutos: Int! @default(value: 450)
  cierreMinutos: Int! @default(value: 1380)
  anticipacionMinutos: Int! @default(value: 60)
  intervaloMinutos: Int! @default(value: 15)
  # HU-10: pedidos que se aceptan por cada hora de recogida.
  capacidadPorFranja: Int! @default(value: 20)
  # HU-07: la cocina puede aceptar sin anticipación los pedidos que solo
  # llevan artículos de preparación inmediata.
  permitirInmediatos: Boolean! @default(value: false)
  zonaHoraria: String! @default(value: "America/Mexico_City")
  # HU-08: cuenta donde los alumnos transfieren. Son datos públicos de cobro
  # de la cafetería, no credenciales.
  banco: String
  clabe: String
  titular: String
  activa: Boolean! @default(value: true)
}

# Estación de la cafetería: tortas y hamburguesas, tacos, guisados, tiendita.
type Puesto @table {
  nombre: String!
  ubicacion: String
  orden: Int! @default(value: 0)
  activo: Boolean! @default(value: true)
  cafeteria: Cafeteria!
}

type Producto @table {
  nombre: String!
  precio: Float!
  cantidadEnStock: Int! @default(value: 0)
  descripcion: String
  urlDeImagen: String
  categoria: String! @default(value: "General")
  disponible: Boolean! @default(value: true)
  eliminado: Boolean! @default(value: false)
  # HU-21: precio promocional vigente hasta ofertaHasta.
  precioOferta: Float
  ofertaHasta: Timestamp
  esEspecialidad: Boolean! @default(value: false)
  # HU-07: se entrega al momento (ej. bebidas frías preempaquetadas).
  preparacionInmediata: Boolean! @default(value: false)
  puesto: Puesto!
}

type Pedido @table {
  folio: Int! @unique
  montoTotal: Float!
  # por_pagar -> pago_en_revision -> pendiente -> preparando -> listo -> entregado
  # (o cancelado, o no_recogido si el alumno no se presentó).
  # "pendiente" es un pedido pagado que espera en cocina.
  estado: String! @default(value: "por_pagar")
  fechaCreacion: Timestamp! @default(expr: "request.time")
  recogerA: Timestamp!
  notas: String
  # HU-08: el alumno transfiere con esta referencia como concepto y sube el
  # comprobante; el encargado lo valida antes de que el pedido entre a cocina.
  referenciaPago: String
  comprobanteUrl: String
  motivoRechazoPago: String
  pagadoEn: Timestamp
  # HU-09: PIN de 4 dígitos que se genera al aprobar el pago. Solo lo ve el
  # alumno; el encargado lo captura para entregar. Tras 5 errores se bloquea.
  codigoEntrega: String
  intentosEntrega: Int! @default(value: 0)
  entregadoEn: Timestamp
  esCredito: Boolean! @default(value: false)
  usuario: Usuario!
  cafeteria: Cafeteria!
}

type ContadorFolio @table(key: "nombre") {
  nombre: String!
  valor: Int!
}

type DetallePedido @table {
  cantidad: Int!
  precioEnElMomento: Float!
  pedido: Pedido!
  producto: Producto!
}

type Adeudo @table {
  montoPendiente: Float!
  fechaUltimaActualizacion: Timestamp!
  usuario: Usuario! @unique
}

type Pago @table {
  montoPagado: Float!
  fechaPago: Timestamp!
  usuario: Usuario!
  pedido: Pedido
}

type CarritoItem @table {
  cantidad: Int!
  precioEnElMomento: Float!
  usuario: Usuario!
  producto: Producto!
}

# HU-05: token de FCM de cada dispositivo con sesión. Un token pertenece a un
# solo usuario; si otro inicia sesión en el mismo teléfono, el token cambia de dueño.
type DispositivoToken @table(key: "token") {
  token: String!
  plataforma: String!
  actualizado: Timestamp! @default(expr: "request.time")
  usuario: Usuario!
}

# Quien se registra como empleado queda como alumno hasta que el encargado de
# esa cafetería apruebe su solicitud. Una solicitud por usuario.
type SolicitudEmpleo @table(key: "usuario") {
  usuario: Usuario!
  cafeteria: Cafeteria!
  fechaSolicitud: Timestamp! @default(expr: "request.time")
}

type Notificacion @table {
  titulo: String!
  mensaje: String!
  fechaEnvio: Timestamp! @default(expr: "request.time")
  leido: Boolean! @default(value: false)
  usuario: Usuario!
  pedido: Pedido
}
