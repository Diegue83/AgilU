# Estaciones de la cafetería del encargado con sesión (HU-18). Al empleado
# solo le llega la estación que tiene asignada.
query MisEstaciones @auth(level: USER) {
  puestos(
    where: {
      _or: [
        {
          cafeteria: {
            usuarios_on_cafeteria: {
              exist: {
                rol: { rolPermisos_on_rol: { exist: { permiso: { codigoAccion: { eq: "catalogo.gestionar" } } } } }
                autenticacion_on_usuario: { firebaseAuthUid: { eq_expr: "auth.uid" } }
              }
            }
          }
        }
        {
          usuarios_on_puesto: {
            exist: {
              rol: { rolPermisos_on_rol: { exist: { permiso: { codigoAccion: { eq: "estacion.propia" } } } } }
              autenticacion_on_usuario: { firebaseAuthUid: { eq_expr: "auth.uid" } }
            }
          }
        }
      ]
    }
    orderBy: [{ orden: ASC }, { nombre: ASC }]
  ) {
    id
    nombre
    orden
    activo
    banco
    clabe
    titular
    productos_on_puesto(where: { eliminado: { eq: false } }) {
      id
    }
  }
}

