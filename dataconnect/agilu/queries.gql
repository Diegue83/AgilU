}

# Estaciones de la cafetería del encargado con sesión (HU-18).
query MisEstaciones @auth(level: USER) {
  puestos(
    where: {
      cafeteria: {
        usuarios_on_cafeteria: {
          exist: {
            rol: { nombre: { eq: "encargado" } }
            autenticacion_on_usuario: { firebaseAuthUid: { eq_expr: "auth.uid" } }
          }
        }
      }
    }
    orderBy: [{ orden: ASC }, { nombre: ASC }]
  ) {
    id
    nombre
    orden
    activo
    productos_on_puesto(where: { eliminado: { eq: false } }) {
      id
    }
  }
}

# Productos de la cafetería del encargado con sesión (HU-14).
query MisProductos @auth(level: USER) {
  productos(
    where: {
      eliminado: { eq: false }
      puesto: {
        cafeteria: {
          usuarios_on_cafeteria: {
            exist: {
              rol: { nombre: { eq: "encargado" } }
              autenticacion_on_usuario: { firebaseAuthUid: { eq_expr: "auth.uid" } }
            }
          }
        }
      }
    }
    orderBy: [{ nombre: ASC }]
  ) {
    id
    nombre
    descripcion
    precio
    categoria
    disponible
    cantidadEnStock
    urlDeImagen
    precioOferta
    ofertaHasta
    esEspecialidad
    preparacionInmediata
    puesto {
      id
      nombre
      orden
      cafeteria {
        id
      }
    }
  }
}

# HU-19: cafeterías abiertas con su horario, para el menú del día.
query ListarCafeterias
  @auth(level: USER, insecureReason: "El horario de las cafeterías es el mismo para todos los alumnos con sesión.") {
  cafeterias(where: { activa: { eq: true } }, orderBy: [{ nombre: ASC }]) {
    id
    nombre
    aperturaMinutos
    cierreMinutos
    anticipacionMinutos
    intervaloMinutos
    capacidadPorFranja
    permitirInmediatos
    zonaHoraria
    activa
  }
}

# HU-10: cuántos pedidos hay en cada hora de recogida de hoy. Solo regresa
# horas y conteos, sin datos de los alumnos.
query OcupacionFranjas($cafeteriaId: UUID!)
  @auth(level: USER, insecureReason: "Solo expone conteos por hora, sin datos personales.") {
  franjas: _select(
    sql: """
    SELECT o.recoger_a AS "recogerA", count(*)::int AS "pedidos"
    FROM pedido o
    JOIN cafeteria c ON c.id = o.cafeteria_id
    WHERE o.cafeteria_id = $1::uuid
      AND o.estado <> 'cancelado'
      AND (o.recoger_a AT TIME ZONE c.zona_horaria)::date = (now() AT TIME ZONE c.zona_horaria)::date
    GROUP BY o.recoger_a
    """
    params: [$cafeteriaId]
  )
}

# HU-10: si CrearPedido no insertó nada, explica por qué con las mismas reglas.
query DiagnosticarPedido($cafeteriaId: UUID!, $recogerA: Timestamp!, $items: Any!)
  @auth(level: USER) {
  diagnostico: _selectFirst(
    sql: """
    WITH
      cliente AS (SELECT usuario_id FROM autenticacion WHERE firebase_auth_uid = $1),
      caf AS (SELECT * FROM cafeteria WHERE id = $2::uuid),
      f AS (
        SELECT caf.*,
               ($3::timestamptz AT TIME ZONE caf.zona_horaria) AS local,
               (now() AT TIME ZONE caf.zona_horaria) AS ahora_local
        FROM caf
      ),
      pedidos_items AS (
        SELECT (e->>'productoId')::uuid AS producto_id, (e->>'cantidad')::int AS cantidad
        FROM jsonb_array_elements($4::jsonb) AS e
      ),
      validos AS (
        SELECT i.producto_id, p.preparacion_inmediata FROM pedidos_items i
        JOIN producto p ON p.id = i.producto_id
        JOIN puesto e ON e.id = p.puesto_id
        WHERE p.disponible AND NOT p.eliminado AND e.activo
          AND e.cafeteria_id = $2::uuid AND i.cantidad BETWEEN 1 AND 50
      ),
      m AS (
        SELECT f.*, (extract(hour FROM f.local) * 60 + extract(minute FROM f.local))::int AS minuto
        FROM f
      )
    SELECT CASE
      WHEN NOT EXISTS (SELECT 1 FROM cliente) THEN 'Tu perfil no está listo. Cierra sesión y vuelve a entrar.'
      WHEN (SELECT count(*) FROM pedido o JOIN cliente ON o.usuario_id = cliente.usuario_id
            WHERE o.estado = 'no_recogido' AND o.recoger_a > now() - interval '30 days') >= 3
        THEN 'Tienes 3 pedidos sin recoger en los últimos 30 días; por ahora no puedes hacer pedidos nuevos.'
      WHEN NOT EXISTS (SELECT 1 FROM caf WHERE activa) THEN 'La cafetería no está recibiendo pedidos.'
      WHEN (SELECT count(*) FROM validos) <> (SELECT count(*) FROM pedidos_items)
        THEN 'Algún producto ya no está disponible. Revisa tu carrito.'
      WHEN (SELECT local::date <> ahora_local::date FROM m) THEN 'Solo se pueden hacer pedidos para hoy.'
      WHEN (SELECT minuto < apertura_minutos OR minuto > cierre_minutos FROM m)
        THEN 'La hora elegida está fuera del horario de la cafetería.'
      WHEN (SELECT $3::timestamptz < now() + make_interval(mins =>
              CASE WHEN permitir_inmediatos
                        AND NOT EXISTS (SELECT 1 FROM validos WHERE NOT preparacion_inmediata)
                   THEN 0 ELSE greatest(anticipacion_minutos - 5, 0) END) FROM m)
        THEN 'Los pedidos requieren ' || (SELECT anticipacion_minutos FROM caf) || ' minutos de anticipación. Elige otra hora.'
      WHEN (SELECT count(*) FROM pedido o WHERE o.cafeteria_id = $2::uuid
              AND o.recoger_a = $3::timestamptz AND o.estado <> 'cancelado')
           >= (SELECT capacidad_por_franja FROM caf)
        THEN 'Esa hora ya se llenó. Elige otra.'
      ELSE 'No se pudo registrar el pedido. Intenta de nuevo.'
    END AS motivo
    """
    params: [{ _expr: "auth.uid" }, $cafeteriaId, $recogerA, $items]
  )
}

# HU-10: configuración de la cafetería del encargado.
query MiCafeteria @auth(level: USER) {
  autenticacion(key: { firebaseAuthUid_expr: "auth.uid" }) {
    usuario {
      rol {
        nombre
      }
      cafeteria {
        id
        nombre
        aperturaMinutos
        cierreMinutos
        anticipacionMinutos
        intervaloMinutos
        capacidadPorFranja
        permitirInmediatos
      }
    }
  }
}

# HU-06: pedidos de hoy de la cafetería del encargado, en orden de recogida.
query PanelPedidos($desde: Timestamp!, $hasta: Timestamp!) @auth(level: USER) {
  pedidos(
    where: {
      cafeteria: {
        usuarios_on_cafeteria: {
          exist: {
            rol: { nombre: { eq: "encargado" } }
            autenticacion_on_usuario: { firebaseAuthUid: { eq_expr: "auth.uid" } }
          }
        }
      }
      estado: { in: ["pendiente", "preparando", "listo"] }
      recogerA: { ge: $desde, lt: $hasta }
    }
    orderBy: [{ recogerA: ASC }, { folio: ASC }]
  ) {
    id
    folio
    estado
    recogerA
    notas
    montoTotal
    intentosEntrega
    usuario {
      nombre
    }
    detallePedidos_on_pedido {
      cantidad
      producto {
        nombre
      }
    }
  }
}

# HU-08: comprobantes que esperan validación en la cafetería del encargado.
query PagosPorValidar @auth(level: USER) {
  pedidos(
    where: {
      cafeteria: {
        usuarios_on_cafeteria: {
          exist: {
            rol: { nombre: { eq: "encargado" } }
            autenticacion_on_usuario: { firebaseAuthUid: { eq_expr: "auth.uid" } }
          }
        }
      }
      estado: { eq: "pago_en_revision" }
    }
    orderBy: [{ recogerA: ASC }]
  ) {
    id
    folio
    referenciaPago
    montoTotal
    recogerA
    comprobanteUrl
    usuario {
      nombre
    }
  }
}

# HU-23: pedidos que el alumno con sesión no recogió en los últimos 30 días.
query MiConfianza @auth(level: USER) {
  confianza: _selectFirst(
    sql: """
    SELECT count(*)::int AS "noRecogidos"
    FROM pedido o
    JOIN autenticacion a ON a.usuario_id = o.usuario_id
    WHERE a.firebase_auth_uid = $1
      AND o.estado = 'no_recogido'
      AND o.recoger_a > now() - interval '30 days'
    """
    params: [{ _expr: "auth.uid" }]
  )
}

# HU-05: avisos recibidos por el alumno con sesión.
query MisNotificaciones @auth(level: USER) {
  notificacions(
    where: {
      usuario: { autenticacion_on_usuario: { firebaseAuthUid: { eq_expr: "auth.uid" } } }
    }
    orderBy: [{ fechaEnvio: DESC }]
    limit: 20
  ) {
    id
    titulo
    mensaje
    fechaEnvio
    leido
  }
}
