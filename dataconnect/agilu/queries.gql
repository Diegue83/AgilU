query ListarMenu
  @auth(level: USER, insecureReason: "El menú es el mismo para todos los alumnos con sesión.")
  @refresh(every: { seconds: 30 }) {
  productos(
    where: { puesto: { activo: { eq: true }, cafeteria: { activa: { eq: true } } } }
    orderBy: [{ nombre: ASC }]
  ) {
    id
    nombre
    descripcion
    precio
    categoria
    disponible
    puesto {
      id
      nombre
      orden
      cafeteria {
        id
        nombre
      }
    }
  }
}

query MiPerfil @auth(level: USER) {
  autenticacion(key: { firebaseAuthUid_expr: "auth.uid" }) {
    correoElectronico
    usuario {
      id
      nombre
      rol {
        nombre
      }
      cafeteria {
        id
        nombre
      }
    }
  }
}

query MiPedido($id: UUID!) @auth(level: USER) {
  pedidos(
    where: {
      id: { eq: $id }
      usuario: { autenticacion_on_usuario: { firebaseAuthUid: { eq_expr: "auth.uid" } } }
    }
    limit: 1
  ) {
    id
    folio
    montoTotal
    estado
    recogerA
  }
}

query MisPedidos @auth(level: USER) {
  pedidos(
    where: {
      usuario: { autenticacion_on_usuario: { firebaseAuthUid: { eq_expr: "auth.uid" } } }
    }
    orderBy: [{ fechaCreacion: DESC }]
  ) {
    id
    folio
    montoTotal
    estado
    recogerA
    notas
    cafeteria {
      nombre
    }
    detallePedidos_on_pedido {
      cantidad
      precioEnElMomento
      producto {
        nombre
      }
    }
  }
}

# Estaciones de la cafetería del encargado con sesión (HU-18).
query MisEstaciones @auth(level: USER) {
  puestos(
    where: {
      cafeteria: {
        usuarios_on_cafeteria: {
          exist: {
            rol: { nombre: { eq: "encargado" } }
            autenticacion_on_usuario: { firebaseAuthUid: { eq_expr: "auth.uid" } }
          }
        }
      }
    }
    orderBy: [{ orden: ASC }, { nombre: ASC }]
  ) {
    id
    nombre
    orden
    activo
    productos_on_puesto {
      id
    }
  }
}

# Productos de la cafetería del encargado con sesión (HU-14).
query MisProductos @auth(level: USER) {
  productos(
    where: {
      puesto: {
        cafeteria: {
          usuarios_on_cafeteria: {
            exist: {
              rol: { nombre: { eq: "encargado" } }
              autenticacion_on_usuario: { firebaseAuthUid: { eq_expr: "auth.uid" } }
            }
          }
        }
      }
    }
    orderBy: [{ nombre: ASC }]
  ) {
    id
    nombre
    descripcion
    precio
    categoria
    disponible
    cantidadEnStock
    urlDeImagen
    puesto {
      id
      nombre
      orden
      cafeteria {
        id
      }
    }
  }
}
