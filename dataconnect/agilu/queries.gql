# HU-06: pedidos de hoy de la cafetería del encargado o empleado, en orden de recogida.
query PanelPedidos($desde: Timestamp!, $hasta: Timestamp!) @auth(level: USER) {
  pedidos(
    where: {
      cafeteria: {
        usuarios_on_cafeteria: {
          exist: {
            rol: { rolPermisos_on_rol: { exist: { permiso: { codigoAccion: { eq: "pedidos.atender" } } } } }
            autenticacion_on_usuario: { firebaseAuthUid: { eq_expr: "auth.uid" } }
          }
        }
      }
      estado: { in: ["pendiente", "preparando", "listo"] }
      recogerA: { ge: $desde, lt: $hasta }
    }
    orderBy: [{ recogerA: ASC }, { folio: ASC }]
  ) {
    id
    folio
    estado
    recogerA
    notas
    montoTotal
    intentosEntrega
    fechaCreacion
    esCredito
    usuario {
      nombre
    }
    detallePedidos_on_pedido {
      cantidad
      producto {
        nombre
      }
    }
  }
}

# HU-08: comprobantes que esperan validación en la cafetería del encargado.
query PagosPorValidar @auth(level: USER) {
  pedidos(
    where: {
      _and: [
        {
          _or: [
            {
              cafeteria: {
                usuarios_on_cafeteria: {
                  exist: {
                    rol: { rolPermisos_on_rol: { exist: { permiso: { codigoAccion: { eq: "pagos.validar" } } } } }
                    autenticacion_on_usuario: { firebaseAuthUid: { eq_expr: "auth.uid" } }
                    puestoId: { isNull: true }
                  }
                }
              }
            }
            {
              puesto: {
                usuarios_on_puesto: {
                  exist: {
                    rol: { rolPermisos_on_rol: { exist: { permiso: { codigoAccion: { eq: "pagos.validar" } } } } }
                    autenticacion_on_usuario: { firebaseAuthUid: { eq_expr: "auth.uid" } }
                  }
                }
              }
            }
          ]
        }
        { estado: { eq: "pago_en_revision" } }
      ]
    }
    orderBy: [{ recogerA: ASC }]
  ) {
    id
    folio
    referenciaPago
    montoTotal
    recogerA
    comprobanteUrl
    puesto {
      nombre
    }
    usuario {
      nombre
    }
  }
}

# HU-23: confianza del alumno con sesión, de 0 a 100. Cada pedido sin recoger
# quita 20 puntos; se recuperan 5 por día desde que el adeudo se paga (o desde
# la hora de recogida si el pedido ya estaba pagado). Con 100 puede pagar al
# recoger. "adeudo" es lo que debe de pedidos a pagar al recoger: cuenta desde
# que se piden y hasta que se pagan.
query MiConfianza @auth(level: USER) {
  confianza: _selectFirst(
    sql: """
    WITH yo AS (SELECT usuario_id AS id FROM autenticacion WHERE firebase_auth_uid = $1)
    SELECT
      (SELECT count(*) FROM pedido o
        WHERE o.usuario_id = yo.id AND o.estado = 'no_recogido'
          AND o.recoger_a > now() - interval '30 days')::int AS "noRecogidos",
      greatest(0, 100 - coalesce((
          SELECT sum(CASE
                   WHEN n.es_credito AND n.pagado_en IS NULL THEN 20
                   ELSE greatest(0, 20 - 5 * floor(extract(epoch FROM now() -
                          CASE WHEN n.es_credito THEN n.pagado_en ELSE n.recoger_a END) / 86400))::int
                 END)
          FROM pedido n
          WHERE n.usuario_id = yo.id AND n.estado = 'no_recogido'), 0))::int AS "puntos",
      coalesce((SELECT sum(c.monto_total) FROM pedido c
        WHERE c.usuario_id = yo.id AND c.es_credito AND c.pagado_en IS NULL
          AND c.estado <> 'cancelado'), 0)::float AS "adeudo",
      (SELECT count(*) FROM pedido c
          WHERE c.usuario_id = yo.id AND c.es_credito AND c.pagado_en IS NULL
            AND c.estado <> 'cancelado')::int AS "creditosAbiertos"
    FROM yo
    """
    params: [{ _expr: "auth.uid" }]
  )
}

# El encargado ve los pedidos a pagar al recoger que no se recogieron y siguen
# sin pagar: son los adeudos que puede cobrar.
query AdeudosPorCobrar @auth(level: USER) {
  pedidos(
    where: {
      _and: [
        {
          _or: [
            {
              cafeteria: {
                usuarios_on_cafeteria: {
                  exist: {
                    rol: { rolPermisos_on_rol: { exist: { permiso: { codigoAccion: { eq: "pagos.validar" } } } } }
                    autenticacion_on_usuario: { firebaseAuthUid: { eq_expr: "auth.uid" } }
                    puestoId: { isNull: true }
                  }
                }
              }
            }
            {
              puesto: {
                usuarios_on_puesto: {
                  exist: {
                    rol: { rolPermisos_on_rol: { exist: { permiso: { codigoAccion: { eq: "pagos.validar" } } } } }
                    autenticacion_on_usuario: { firebaseAuthUid: { eq_expr: "auth.uid" } }
                  }
                }
              }
            }
          ]
        }
        { estado: { eq: "no_recogido" }, esCredito: { eq: true }, pagadoEn: { isNull: true } }
      ]
    }
    orderBy: [{ recogerA: ASC }]
  ) {
    id
    folio
    montoTotal
    recogerA
    puesto {
      nombre
    }
    usuario {
      nombre
    }
  }
}

