    where: {
      id: { eq: $id }
      usuario: { autenticacion_on_usuario: { firebaseAuthUid: { eq_expr: "auth.uid" } } }
    }
    limit: 1
  ) {
    id
    folio
    montoTotal
    estado
    recogerA
    notas
    referenciaPago
    comprobanteUrl
    motivoRechazoPago
    pagadoEn
