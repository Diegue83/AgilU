query ListarMenu
  @auth(level: USER, insecureReason: "El menú es el mismo para todos los alumnos con sesión.")
  @refresh(every: { seconds: 30 }) {
  productos(
    where: {
      eliminado: { eq: false }
      puesto: { activo: { eq: true }, cafeteria: { activa: { eq: true } } }
    }
    orderBy: [{ nombre: ASC }]
  ) {
    id
    nombre
    descripcion
    precio
    categoria
    disponible
    controlarStock
    cantidadEnStock
    urlDeImagen
    precioOferta
    ofertaHasta
    esEspecialidad
    preparacionInmediata
    puesto {
      id
      nombre
      orden
      cafeteria {
        id
        nombre
      }
    }
  }
}

