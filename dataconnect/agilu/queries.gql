    codigoEntrega
    entregadoEn
    grupoCompra
    puesto {
      nombre
      banco
      clabe
      titular
    }
    cafeteria {
      nombre
      ubicacion
      banco
      clabe
      titular
    }
    detallePedidos_on_pedido {
      cantidad
      precioEnElMomento
      producto {
        nombre
      }
