query ListarMenu
  @auth(level: USER, insecureReason: "El menú es el mismo para todos los alumnos con sesión.")
  @refresh(every: { seconds: 30 }) {
  productos(
    where: {
      eliminado: { eq: false }
      puesto: { activo: { eq: true }, cafeteria: { activa: { eq: true } } }
    }
    orderBy: [{ nombre: ASC }]
  ) {
    id
    nombre
    descripcion
    precio
    categoria
    disponible
    urlDeImagen
    precioOferta
    ofertaHasta
    esEspecialidad
    preparacionInmediata
    puesto {
      id
      nombre
      orden
      cafeteria {
        id
        nombre
      }
    }
  }
}

query MiPerfil @auth(level: USER) {
  autenticacion(key: { firebaseAuthUid_expr: "auth.uid" }) {
    correoElectronico
    usuario {
      id
      nombre
      rol {
        nombre
      }
      cafeteria {
        id
        nombre
      }
    }
  }
}

query MiPedido($id: UUID!) @auth(level: USER) {
  pedidos(
    where: {
      id: { eq: $id }
      usuario: { autenticacion_on_usuario: { firebaseAuthUid: { eq_expr: "auth.uid" } } }
    }
    limit: 1
  ) {
    id
    folio
    montoTotal
    estado
    recogerA
    notas
    referenciaPago
    comprobanteUrl
    motivoRechazoPago
    pagadoEn
    codigoEntrega
    entregadoEn
    cafeteria {
      nombre
      ubicacion
      banco
      clabe
      titular
    }
    detallePedidos_on_pedido {
      cantidad
      precioEnElMomento
      producto {
        nombre
      }
    }
  }
}

query MisPedidos @auth(level: USER) {
