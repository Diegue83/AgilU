# Reporte de la cafetería de quien tiene el permiso reporte.ver (el encargado):
# pedidos, entregas, no recogidos, cancelados e ingresos en el periodo.
query ReporteCafeteria($desde: Timestamp!, $hasta: Timestamp!) @auth(level: USER) {
  filas: _select(
    sql: """
    SELECT c.id AS "cafeteriaId",
           c.nombre AS "cafeteria",
           count(o.id) FILTER (WHERE o.estado <> 'cancelado')::int AS "pedidos",
           count(o.id) FILTER (WHERE o.estado = 'entregado')::int AS "entregados",
           count(o.id) FILTER (WHERE o.estado = 'no_recogido')::int AS "noRecogidos",
           count(o.id) FILTER (WHERE o.estado = 'cancelado')::int AS "cancelados",
           coalesce(sum(o.monto_total) FILTER (WHERE o.pagado_en IS NOT NULL), 0)::float8 AS "ingresos",
           coalesce(sum(o.monto_total) FILTER (WHERE o.estado = 'no_recogido'), 0)::float8 AS "montoNoRecogido"
    FROM cafeteria c
    LEFT JOIN pedido o ON o.cafeteria_id = c.id
      AND o.recoger_a >= $2::timestamptz AND o.recoger_a < $3::timestamptz
    WHERE c.id = (
      SELECT u.cafeteria_id FROM usuario u
      JOIN autenticacion a ON a.usuario_id = u.id
      JOIN rol r ON r.id = u.rol_id
      WHERE a.firebase_auth_uid = $1 AND EXISTS (SELECT 1 FROM rol_permiso rp JOIN permiso pe ON pe.id = rp.permiso_id WHERE rp.rol_id = r.id AND pe.codigo_accion = 'reporte.ver')
    )
    GROUP BY c.id, c.nombre
    """
    params: [{ _expr: "auth.uid" }, $desde, $hasta]
  )
}

# Historial: pedidos ya terminados (entregados, cancelados o no recogidos) de la
# cafetería del encargado o empleado, del más reciente al más antiguo.
query HistorialPedidos($desde: Timestamp!, $hasta: Timestamp!) @auth(level: USER) {
  pedidos(
    where: {
      cafeteria: {
        usuarios_on_cafeteria: {
          exist: {
            rol: { rolPermisos_on_rol: { exist: { permiso: { codigoAccion: { eq: "pedidos.atender" } } } } }
            autenticacion_on_usuario: { firebaseAuthUid: { eq_expr: "auth.uid" } }
          }
        }
      }
      estado: { in: ["entregado", "cancelado", "no_recogido"] }
      recogerA: { ge: $desde, lt: $hasta }
    }
    orderBy: [{ recogerA: DESC }, { folio: DESC }]
    limit: 300
  ) {
    id
    folio
    estado
    recogerA
    notas
    montoTotal
    usuario {
      nombre
    }
    detallePedidos_on_pedido {
      cantidad
      producto {
        nombre
      }
    }
  }
}

# Puntos rojos de la navegación: cuántas cosas esperan al usuario con sesión.
# Cada conteo depende del rol: el encargado ve pagos por validar, pedidos en
# espera y solicitudes de su cafetería; el empleado, pedidos en espera; el
# alumno, sus pedidos listos y sus avisos sin leer.
query MisPendientes @auth(level: USER) {
  pendientes: _selectFirst(
    sql: """
    WITH yo AS (
      SELECT u.id AS usuario_id, u.cafeteria_id, coalesce(r.nombre, 'alumno') AS rol,
             coalesce(array_agg(pe.codigo_accion) FILTER (WHERE pe.id IS NOT NULL), '{}') AS permisos
      FROM autenticacion a
      JOIN usuario u ON u.id = a.usuario_id
      LEFT JOIN rol r ON r.id = u.rol_id
      LEFT JOIN rol_permiso rp ON rp.rol_id = r.id
      LEFT JOIN permiso pe ON pe.id = rp.permiso_id
      WHERE a.firebase_auth_uid = $1
      GROUP BY u.id, u.cafeteria_id, r.nombre
    )
    SELECT
      yo.rol AS "rol",
      CASE WHEN 'pagos.validar' = ANY (yo.permisos) THEN
        (SELECT count(*) FROM pedido p WHERE p.cafeteria_id = yo.cafeteria_id AND p.estado = 'pago_en_revision')
      ELSE 0 END::int AS "pagos",
      CASE WHEN 'pedidos.atender' = ANY (yo.permisos) THEN
        (SELECT count(*) FROM pedido p WHERE p.cafeteria_id = yo.cafeteria_id AND p.estado = 'pendiente')
      ELSE 0 END::int AS "enEspera",
      CASE WHEN 'personal.gestionar' = ANY (yo.permisos) THEN
        (SELECT count(*) FROM solicitud_empleo s WHERE s.cafeteria_id = yo.cafeteria_id)
      ELSE 0 END::int AS "solicitudes",
      (SELECT count(*) FROM pedido p WHERE p.usuario_id = yo.usuario_id AND p.estado = 'listo')::int AS "listos",
      (SELECT count(*) FROM notificacion n WHERE n.usuario_id = yo.usuario_id AND NOT n.leido)::int AS "avisos"
    FROM yo
    """
    params: [{ _expr: "auth.uid" }]
  )
}
