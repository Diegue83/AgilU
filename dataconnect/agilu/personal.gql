# Gestión de personal y de cafeterías.
#
# Cada operación del personal exige un permiso (Permiso.codigoAccion) que el
# rol de quien llama debe tener en RolPermiso. El catálogo de permisos es fijo
# (cada código lo revisa alguna operación); el administrador crea roles y les
# da o quita permisos. Roles de sistema: alumno (sin permisos), empleado,
# encargado y admin. El rol admin siempre conserva admin.gestionar.
#
# Toda comprobación se hace aquí, en el servidor, con el uid del token.
# El primer admin se asigna desde la consola con la mutación AsignarRol.

# ---------- Administrador ----------

query CafeteriasAdmin @auth(level: USER) {
  cafeterias: _select(
    sql: """
    SELECT c.id, c.nombre, c.ubicacion, c.activa
    FROM cafeteria c
    WHERE EXISTS (
      SELECT 1 FROM usuario u
      JOIN autenticacion a ON a.usuario_id = u.id
      JOIN rol r ON r.id = u.rol_id
      WHERE a.firebase_auth_uid = $1 AND EXISTS (SELECT 1 FROM rol_permiso rp JOIN permiso pe ON pe.id = rp.permiso_id WHERE rp.rol_id = r.id AND pe.codigo_accion = 'admin.gestionar')
    )
    ORDER BY c.nombre
    """
    params: [{ _expr: "auth.uid" }]
  )
}

query PersonalAdmin @auth(level: USER) {
  personal: _select(
    sql: """
    SELECT u.id AS "usuarioId", u.nombre, a.correo_electronico AS "correo",
           r.nombre AS "rol", c.id AS "cafeteriaId", c.nombre AS "cafeteria"
    FROM usuario u
    JOIN autenticacion a ON a.usuario_id = u.id
    JOIN rol r ON r.id = u.rol_id
    LEFT JOIN cafeteria c ON c.id = u.cafeteria_id
    WHERE r.nombre <> 'alumno'
      AND EXISTS (
        SELECT 1 FROM usuario yo
        JOIN autenticacion ya ON ya.usuario_id = yo.id
        JOIN rol yr ON yr.id = yo.rol_id
        WHERE ya.firebase_auth_uid = $1 AND EXISTS (SELECT 1 FROM rol_permiso rp JOIN permiso pe ON pe.id = rp.permiso_id WHERE rp.rol_id = yr.id AND pe.codigo_accion = 'admin.gestionar')
      )
    ORDER BY r.nombre, u.nombre
    """
    params: [{ _expr: "auth.uid" }]
  )
}

mutation CrearCafeteriaAdmin($nombre: String!, $ubicacion: String)
  @auth(expr: "auth != null && vars.nombre.trim().size() > 0 && vars.nombre.size() <= 80")
  @transaction {
  query @redact {
    autenticacion(key: { firebaseAuthUid_expr: "auth.uid" })
      @check(expr: "this != null", message: "No tienes perfil") {
      usuario {
        rol @check(expr: "this != null", message: "No tienes permiso para hacer esto") {
          rolPermisos_on_rol(where: { permiso: { codigoAccion: { eq: "admin.gestionar" } } })
            @check(expr: "this.size() == 1", message: "No tienes permiso para hacer esto") {
            permiso {
              codigoAccion
            }
          }
        }
      }
    }
  }
  cafeteria_insert(data: { nombre: $nombre, ubicacion: $ubicacion })
}

mutation EditarCafeteriaAdmin($id: UUID!, $nombre: String!, $ubicacion: String, $activa: Boolean!)
  @auth(expr: "auth != null && vars.nombre.trim().size() > 0 && vars.nombre.size() <= 80")
  @transaction {
  query @redact {
    autenticacion(key: { firebaseAuthUid_expr: "auth.uid" })
      @check(expr: "this != null", message: "No tienes perfil") {
      usuario {
        rol @check(expr: "this != null", message: "No tienes permiso para hacer esto") {
          rolPermisos_on_rol(where: { permiso: { codigoAccion: { eq: "admin.gestionar" } } })
            @check(expr: "this.size() == 1", message: "No tienes permiso para hacer esto") {
            permiso {
              codigoAccion
            }
          }
        }
      }
    }
  }
  cafeteria_update(id: $id, data: { nombre: $nombre, ubicacion: $ubicacion, activa: $activa })
    @check(expr: "this != null", message: "La cafetería no existe")
}

# Asigna un rol a la cuenta con ese correo. Un rol con permisos de cafetería
# (cualquiera distinto de admin.gestionar) necesita una cafetería activa; los
# demás la dejan vacía. El admin no puede cambiarse su propio rol, así no se
# queda el sistema sin administrador por error.
# Devuelve el id del usuario, o null si no se cumplió alguna condición.
mutation AsignarRolAdmin($correo: String!, $rol: String!, $cafeteriaId: UUID)
  @auth(expr: "auth != null && vars.rol.size() > 0 && vars.rol.size() <= 30") {
  resultado: _executeReturningFirst(
    sql: """
    WITH ro AS (
      SELECT r.id, EXISTS (
        SELECT 1 FROM rol_permiso rp JOIN permiso pe ON pe.id = rp.permiso_id
        WHERE rp.rol_id = r.id AND pe.codigo_accion <> 'admin.gestionar'
      ) AS de_cafeteria
      FROM rol r WHERE r.nombre = $3
    )
    UPDATE usuario u
    SET rol_id = (SELECT id FROM ro),
        cafeteria_id = CASE WHEN (SELECT de_cafeteria FROM ro) THEN $4::uuid ELSE NULL END,
        puesto_id = NULL
    FROM autenticacion a
    WHERE a.usuario_id = u.id
      AND lower(a.correo_electronico) = lower(trim($2))
      AND a.firebase_auth_uid <> $1
      AND EXISTS (SELECT 1 FROM ro)
      AND (NOT (SELECT de_cafeteria FROM ro)
           OR EXISTS (SELECT 1 FROM cafeteria WHERE id = $4::uuid AND activa))
      AND EXISTS (SELECT 1 FROM usuario yo JOIN autenticacion ya ON ya.usuario_id = yo.id
        JOIN rol_permiso rp ON rp.rol_id = yo.rol_id JOIN permiso pe ON pe.id = rp.permiso_id
        WHERE ya.firebase_auth_uid = $1 AND pe.codigo_accion = 'admin.gestionar')
    RETURNING u.id AS "usuarioId"
    """
    params: [{ _expr: "auth.uid" }, $correo, $rol, $cafeteriaId]
  )
}

# ---------- Administrador: roles y permisos ----------

# Catálogo fijo de permisos. Lo ve cualquiera con sesión: solo son nombres.
query PermisosDisponibles @auth(level: USER) {
  permisos(orderBy: [{ codigoAccion: ASC }]) {
    id
    nombre
    codigoAccion
  }
}

# Roles con sus permisos y cuántas cuentas los tienen. Solo el administrador.
query RolesAdmin @auth(level: USER) {
  roles: _select(
    sql: """
    SELECT r.id, r.nombre, r.descripcion,
           coalesce((SELECT jsonb_agg(pe.codigo_accion ORDER BY pe.codigo_accion)
                     FROM rol_permiso rp JOIN permiso pe ON pe.id = rp.permiso_id
                     WHERE rp.rol_id = r.id), '[]'::jsonb) AS "permisos",
           (SELECT count(*) FROM usuario u WHERE u.rol_id = r.id)::int AS "usuarios"
    FROM rol r
    WHERE EXISTS (SELECT 1 FROM usuario yo JOIN autenticacion ya ON ya.usuario_id = yo.id
        JOIN rol_permiso rp ON rp.rol_id = yo.rol_id JOIN permiso pe ON pe.id = rp.permiso_id
        WHERE ya.firebase_auth_uid = $1 AND pe.codigo_accion = 'admin.gestionar')
    ORDER BY r.nombre
    """
    params: [{ _expr: "auth.uid" }]
  )
}

# Crea un rol sin permisos. El nombre va en minúsculas, sin espacios.
mutation CrearRolAdmin($nombre: String!, $descripcion: String)
  @auth(expr: "auth != null && vars.nombre.matches('^[a-z][a-z0-9_]{2,29}$') && (!has(vars.descripcion) || vars.descripcion == null || vars.descripcion.size() <= 120)") {
  resultado: _executeReturningFirst(
    sql: """
    INSERT INTO rol (id, nombre, descripcion)
    SELECT gen_random_uuid(), $2, nullif(trim($3::text), '')
    WHERE NOT EXISTS (SELECT 1 FROM rol WHERE nombre = $2)
      AND EXISTS (SELECT 1 FROM usuario yo JOIN autenticacion ya ON ya.usuario_id = yo.id
        JOIN rol_permiso rp ON rp.rol_id = yo.rol_id JOIN permiso pe ON pe.id = rp.permiso_id
        WHERE ya.firebase_auth_uid = $1 AND pe.codigo_accion = 'admin.gestionar')
    RETURNING id AS "rolId"
    """
    params: [{ _expr: "auth.uid" }, $nombre, $descripcion]
  )
}

mutation EditarRolAdmin($rolId: UUID!, $descripcion: String)
  @auth(expr: "auth != null && (!has(vars.descripcion) || vars.descripcion == null || vars.descripcion.size() <= 120)") {
  resultado: _executeReturningFirst(
    sql: """
    UPDATE rol SET descripcion = nullif(trim($3::text), '')
    WHERE id = $2::uuid AND EXISTS (SELECT 1 FROM usuario yo JOIN autenticacion ya ON ya.usuario_id = yo.id
        JOIN rol_permiso rp ON rp.rol_id = yo.rol_id JOIN permiso pe ON pe.id = rp.permiso_id
        WHERE ya.firebase_auth_uid = $1 AND pe.codigo_accion = 'admin.gestionar')
    RETURNING id AS "rolId"
    """
    params: [{ _expr: "auth.uid" }, $rolId, $descripcion]
  )
}

# Borra un rol propio que nadie tiene. Los roles de sistema no se borran.
mutation EliminarRolAdmin($rolId: UUID!) @auth(level: USER) {
  resultado: _executeReturningFirst(
    sql: """
    DELETE FROM rol r
    WHERE r.id = $2::uuid
      AND r.nombre NOT IN ('alumno', 'empleado', 'encargado', 'admin')
      AND NOT EXISTS (SELECT 1 FROM usuario u WHERE u.rol_id = r.id)
      AND EXISTS (SELECT 1 FROM usuario yo JOIN autenticacion ya ON ya.usuario_id = yo.id
        JOIN rol_permiso rp ON rp.rol_id = yo.rol_id JOIN permiso pe ON pe.id = rp.permiso_id
        WHERE ya.firebase_auth_uid = $1 AND pe.codigo_accion = 'admin.gestionar')
    RETURNING r.id AS "rolId"
    """
    params: [{ _expr: "auth.uid" }, $rolId]
  )
}

# Da un permiso a un rol. Devuelve 1 si lo dio y 0 si no se permitió o ya lo
# tenía. El rol alumno no lleva permisos.
mutation DarPermisoAdmin($rolId: UUID!, $codigo: String!) @auth(level: USER) {
  _execute(
    sql: """
    INSERT INTO rol_permiso (rol_id, permiso_id)
    SELECT r.id, p.id FROM rol r JOIN permiso p ON p.codigo_accion = $3
    WHERE r.id = $2::uuid AND r.nombre <> 'alumno'
      AND EXISTS (SELECT 1 FROM usuario yo JOIN autenticacion ya ON ya.usuario_id = yo.id
        JOIN rol_permiso rp ON rp.rol_id = yo.rol_id JOIN permiso pe ON pe.id = rp.permiso_id
        WHERE ya.firebase_auth_uid = $1 AND pe.codigo_accion = 'admin.gestionar')
    ON CONFLICT DO NOTHING
    """
    params: [{ _expr: "auth.uid" }, $rolId, $codigo]
  )
}

# Quita un permiso a un rol. Devuelve 1 si lo quitó. El rol admin no puede
# perder admin.gestionar, así nunca se queda el sistema sin administrador.
mutation QuitarPermisoAdmin($rolId: UUID!, $codigo: String!) @auth(level: USER) {
  _execute(
    sql: """
    DELETE FROM rol_permiso x USING rol r, permiso p
    WHERE x.rol_id = r.id AND x.permiso_id = p.id
      AND r.id = $2::uuid AND p.codigo_accion = $3
      AND NOT (r.nombre = 'admin' AND p.codigo_accion = 'admin.gestionar')
      AND EXISTS (SELECT 1 FROM usuario yo JOIN autenticacion ya ON ya.usuario_id = yo.id
        JOIN rol_permiso rp ON rp.rol_id = yo.rol_id JOIN permiso pe ON pe.id = rp.permiso_id
        WHERE ya.firebase_auth_uid = $1 AND pe.codigo_accion = 'admin.gestionar')
    """
    params: [{ _expr: "auth.uid" }, $rolId, $codigo]
  )
}

# ---------- Encargado: empleados de su cafetería ----------

query MiPersonal @auth(level: USER) {
  personal: _select(
    sql: """
    SELECT u.id AS "usuarioId", u.nombre, a.correo_electronico AS "correo", r.nombre AS "rol",
           e.id AS "estacionId", e.nombre AS "estacion"
    FROM usuario u
    JOIN autenticacion a ON a.usuario_id = u.id
    JOIN rol r ON r.id = u.rol_id
    LEFT JOIN puesto e ON e.id = u.puesto_id
    WHERE r.nombre <> 'alumno'
      AND u.cafeteria_id = (
        SELECT yo.cafeteria_id FROM usuario yo
        JOIN autenticacion ya ON ya.usuario_id = yo.id
        JOIN rol yr ON yr.id = yo.rol_id
        WHERE ya.firebase_auth_uid = $1 AND EXISTS (SELECT 1 FROM rol_permiso rp JOIN permiso pe ON pe.id = rp.permiso_id WHERE rp.rol_id = yr.id AND pe.codigo_accion = 'personal.gestionar')
      )
    ORDER BY r.nombre DESC, u.nombre
    """
    params: [{ _expr: "auth.uid" }]
  )
}

# El encargado da de alta como empleado a una cuenta que ya existe y que no
# tiene otro rol (alumno). No puede nombrar encargados ni tocar otras cafeterías.
mutation AgregarEmpleado($correo: String!) @auth(level: USER) {
  resultado: _executeReturningFirst(
    sql: """
    WITH mia AS (
      SELECT yo.cafeteria_id AS id FROM usuario yo
      JOIN autenticacion ya ON ya.usuario_id = yo.id
      JOIN rol yr ON yr.id = yo.rol_id
      WHERE ya.firebase_auth_uid = $1 AND EXISTS (SELECT 1 FROM rol_permiso rp JOIN permiso pe ON pe.id = rp.permiso_id WHERE rp.rol_id = yr.id AND pe.codigo_accion = 'personal.gestionar') AND yo.cafeteria_id IS NOT NULL
    )
    UPDATE usuario u
    SET rol_id = (SELECT id FROM rol WHERE nombre = 'empleado'),
        cafeteria_id = (SELECT id FROM mia),
        puesto_id = NULL
    FROM autenticacion a
    WHERE a.usuario_id = u.id
      AND lower(a.correo_electronico) = lower(trim($2))
      AND a.firebase_auth_uid <> $1
      AND (u.rol_id IS NULL OR u.rol_id = (SELECT id FROM rol WHERE nombre = 'alumno'))
      AND EXISTS (SELECT 1 FROM mia)
      AND EXISTS (SELECT 1 FROM rol WHERE nombre = 'empleado')
    RETURNING u.id AS "usuarioId"
    """
    params: [{ _expr: "auth.uid" }, $correo]
  )
}

# Quita el rol a un empleado de su cafetería; la cuenta vuelve a ser de alumno.
mutation QuitarEmpleado($usuarioId: UUID!) @auth(level: USER) {
  resultado: _executeReturningFirst(
    sql: """
    UPDATE usuario u
    SET rol_id = (SELECT id FROM rol WHERE nombre = 'alumno'), cafeteria_id = NULL, puesto_id = NULL
    WHERE u.id = $2::uuid
      AND u.rol_id = (SELECT id FROM rol WHERE nombre = 'empleado')
      AND u.cafeteria_id = (
        SELECT yo.cafeteria_id FROM usuario yo
        JOIN autenticacion ya ON ya.usuario_id = yo.id
        JOIN rol yr ON yr.id = yo.rol_id
        WHERE ya.firebase_auth_uid = $1 AND EXISTS (SELECT 1 FROM rol_permiso rp JOIN permiso pe ON pe.id = rp.permiso_id WHERE rp.rol_id = yr.id AND pe.codigo_accion = 'personal.gestionar')
      )
    RETURNING u.id AS "usuarioId"
    """
    params: [{ _expr: "auth.uid" }, $usuarioId]
  )
}

# El encargado asigna a un empleado de su cafetería una estación de esa misma
# cafetería, o se la quita con estacionId nulo. Devuelve null si no se cumplió.
mutation AsignarEstacion($usuarioId: UUID!, $estacionId: UUID) @auth(level: USER) {
  resultado: _executeReturningFirst(
    sql: """
    WITH mia AS (
      SELECT yo.cafeteria_id AS id FROM usuario yo
      JOIN autenticacion ya ON ya.usuario_id = yo.id
      JOIN rol yr ON yr.id = yo.rol_id
      WHERE ya.firebase_auth_uid = $1 AND EXISTS (SELECT 1 FROM rol_permiso rp JOIN permiso pe ON pe.id = rp.permiso_id WHERE rp.rol_id = yr.id AND pe.codigo_accion = 'personal.gestionar') AND yo.cafeteria_id IS NOT NULL
    )
    UPDATE usuario u
    SET puesto_id = $3::uuid
    WHERE u.id = $2::uuid
      AND u.rol_id = (SELECT id FROM rol WHERE nombre = 'empleado')
      AND u.cafeteria_id = (SELECT id FROM mia)
      AND ($3::uuid IS NULL
           OR EXISTS (SELECT 1 FROM puesto e WHERE e.id = $3::uuid AND e.cafeteria_id = (SELECT id FROM mia)))
    RETURNING u.id AS "usuarioId"
    """
    params: [{ _expr: "auth.uid" }, $usuarioId, $estacionId]
  )
}

# ---------- Registro como empleado ----------

# Para el formulario de registro, antes de tener sesión: solo id, nombre y
# ubicación de las cafeterías activas. Sin horarios ni datos de cobro.
query CafeteriasParaRegistro
  @auth(level: PUBLIC, insecureReason: "El registro necesita elegir cafetería antes de tener sesión; solo expone nombres de cafeterías activas.") {
  cafeterias(where: { activa: { eq: true } }, orderBy: [{ nombre: ASC }]) {
    id
    nombre
    ubicacion
  }
}

# Registro como empleado (puede ser alguien externo, no alumno): crea el
# perfil sin rol y la solicitud para esa cafetería. La cuenta solo ve su
# perfil en espera y no puede hacer pedidos hasta que el encargado la apruebe.
mutation CrearPerfilEmpleado($nombre: String!, $telefono: String, $cafeteriaId: UUID!)
  @auth(expr: "auth != null && vars.nombre.trim().size() >= 2 && vars.nombre.size() <= 80 && (!has(vars.telefono) || vars.telefono == null || vars.telefono.matches('^[0-9]{10}$'))")
  @transaction {
  query @redact {
    cafeteria(id: $cafeteriaId)
      @check(expr: "this != null && this.activa", message: "La cafetería no está disponible") {
      activa
    }
  }
  usuario_insert(data: { nombre: $nombre, numeroDeTelefono: $telefono })
  autenticacion_insert(
    data: {
      firebaseAuthUid_expr: "auth.uid"
      correoElectronico_expr: "auth.token.email"
      usuarioId_expr: "response.usuario_insert.id"
    }
  )
  solicitudEmpleo_insert(
    data: { usuarioId_expr: "response.usuario_insert.id", cafeteriaId: $cafeteriaId }
  )
}

# Solicitudes pendientes de la cafetería del encargado con sesión.
query SolicitudesPendientes @auth(level: USER) {
  solicitudEmpleos(
    where: {
      cafeteria: {
        usuarios_on_cafeteria: {
          exist: {
            rol: { rolPermisos_on_rol: { exist: { permiso: { codigoAccion: { eq: "personal.gestionar" } } } } }
            autenticacion_on_usuario: { firebaseAuthUid: { eq_expr: "auth.uid" } }
          }
        }
      }
    }
    orderBy: [{ fechaSolicitud: ASC }]
  ) {
    fechaSolicitud
    usuario {
      id
      nombre
      numeroDeTelefono
      autenticacion_on_usuario {
        correoElectronico
      }
    }
  }
}

# El encargado aprueba una solicitud de su cafetería: la cuenta pasa a
# empleado de esa cafetería y la solicitud se borra.
mutation AprobarSolicitud($usuarioId: UUID!) @auth(level: USER) @transaction {
  query @redact {
    autenticacion(key: { firebaseAuthUid_expr: "auth.uid" })
      @check(expr: "this != null", message: "No tienes perfil") {
      usuario {
        rol @check(expr: "this != null", message: "No tienes permiso para hacer esto") {
          rolPermisos_on_rol(where: { permiso: { codigoAccion: { eq: "personal.gestionar" } } })
            @check(expr: "this.size() == 1", message: "No tienes permiso para hacer esto") {
            permiso {
              codigoAccion
            }
          }
        }
        cafeteria @check(expr: "this != null", message: "No tienes cafetería asignada") {
          id
          solicitudEmpleos_on_cafeteria(where: { usuario: { id: { eq: $usuarioId } } })
            @check(expr: "this.size() == 1", message: "La solicitud ya no existe") {
            fechaSolicitud
          }
        }
      }
    }
    rols(where: { nombre: { eq: "empleado" } }, limit: 1)
      @check(expr: "this.size() == 1", message: "Falta el rol empleado") {
      id
    }
  }
  usuario_update(
    id: $usuarioId
    data: {
      rolId_expr: "response.query.rols[0].id"
      cafeteriaId_expr: "response.query.autenticacion.usuario.cafeteria.id"
    }
  )
  solicitudEmpleo_delete(key: { usuarioId: $usuarioId })
}

# El encargado rechaza una solicitud de su cafetería; la cuenta sigue como
# alumno. Devuelve cuántas borró (0 si no era de su cafetería).
mutation RechazarSolicitud($usuarioId: UUID!) @auth(level: USER) {
  solicitudEmpleo_deleteMany(
    where: {
      usuarioId: { eq: $usuarioId }
      cafeteria: {
        usuarios_on_cafeteria: {
          exist: {
            rol: { rolPermisos_on_rol: { exist: { permiso: { codigoAccion: { eq: "personal.gestionar" } } } } }
            autenticacion_on_usuario: { firebaseAuthUid: { eq_expr: "auth.uid" } }
          }
        }
      }
    }
  )
}
