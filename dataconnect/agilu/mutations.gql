# Todo registro nuevo es alumno. Los demás roles los asigna el administrador
# (o el encargado, para empleados). El servidor valida nombre y teléfono.
mutation CrearPerfil($nombre: String!, $telefono: String)
  @auth(expr: "auth != null && vars.nombre.trim().size() >= 2 && vars.nombre.size() <= 80 && (!has(vars.telefono) || vars.telefono == null || vars.telefono.matches('^[0-9]{10}$'))")
  @transaction {
  query @redact {
    rols(where: { nombre: { eq: "alumno" } }, limit: 1)
      @check(expr: "this.size() == 1", message: "Falta el rol alumno") {
      id
    }
  }
  usuario_insert(
    data: {
      nombre: $nombre
      numeroDeTelefono: $telefono
      rolId_expr: "response.query.rols[0].id"
    }
  )
  autenticacion_insert(
    data: {
      firebaseAuthUid_expr: "auth.uid"
      correoElectronico_expr: "auth.token.email"
      usuarioId_expr: "response.usuario_insert.id"
    }
  )
}

# El precio y el total salen de la tabla producto, nunca del cliente.
# El folio avanza en la misma sentencia, así que dos pedidos no comparten folio.
# Si un producto no existe, no está disponible o es de otra cafetería, no se inserta nada.
mutation CrearPedido(
  $id: UUID!
  $cafeteriaId: UUID!
  $recogerA: Timestamp!
  $notas: String
  $items: Any!
) @auth(level: USER) {
  _execute(
    sql: """
    WITH
      cliente AS (
        SELECT a.usuario_id FROM autenticacion a
        WHERE a.firebase_auth_uid = $1
          AND NOT EXISTS (SELECT 1 FROM solicitud_empleo s WHERE s.usuario_id = a.usuario_id)
      ),
      caf AS (
        SELECT * FROM cafeteria WHERE id = $3::uuid AND activa FOR UPDATE
      ),
      franja AS (
        SELECT caf.*,
               ($4::timestamptz AT TIME ZONE caf.zona_horaria) AS local,
               (now() AT TIME ZONE caf.zona_horaria) AS ahora_local
        FROM caf
      ),
      pedidos_items AS (
        SELECT (e->>'productoId')::uuid AS producto_id,
               (e->>'cantidad')::int AS cantidad
        FROM jsonb_array_elements($6::jsonb) AS e
      ),
      lineas AS (
        SELECT i.producto_id, i.cantidad, p.preparacion_inmediata,
               CASE WHEN p.precio_oferta IS NOT NULL AND p.oferta_hasta > now()
                    THEN p.precio_oferta ELSE p.precio END AS precio
        FROM pedidos_items i
        JOIN producto p ON p.id = i.producto_id
        JOIN puesto e ON e.id = p.puesto_id
        WHERE p.disponible
          AND NOT p.eliminado
          AND e.activo
          AND e.cafeteria_id = $3::uuid
          AND i.cantidad BETWEEN 1 AND 50
      ),
      valido AS (
        SELECT 1 FROM cliente
        WHERE (SELECT count(*) FROM pedido o
               WHERE o.usuario_id = cliente.usuario_id
                 AND o.estado = 'no_recogido'
                 AND o.recoger_a > now() - interval '30 days') < 3
          AND (SELECT count(*) FROM lineas) = (SELECT count(*) FROM pedidos_items)
          AND (SELECT count(*) FROM pedidos_items) BETWEEN 1 AND 50
          AND coalesce(length($5::text), 0) <= 200
          AND EXISTS (
            SELECT 1 FROM franja f
            WHERE f.local::date = f.ahora_local::date
              AND extract(second FROM f.local) = 0
              AND (extract(hour FROM f.local) * 60 + extract(minute FROM f.local))
                  BETWEEN f.apertura_minutos AND f.cierre_minutos
              AND ((extract(hour FROM f.local) * 60 + extract(minute FROM f.local))::int
                   - f.apertura_minutos) % f.intervalo_minutos = 0
              AND $4::timestamptz >= now() + make_interval(mins =>
                    CASE WHEN f.permitir_inmediatos
                              AND NOT EXISTS (SELECT 1 FROM lineas WHERE NOT preparacion_inmediata)
                         THEN 0 ELSE greatest(f.anticipacion_minutos - 5, 0) END)
              AND $4::timestamptz > now()
              AND (SELECT count(*) FROM pedido o
                   WHERE o.cafeteria_id = f.id AND o.recoger_a = $4::timestamptz
                     AND o.estado <> 'cancelado') < f.capacidad_por_franja
          )
      ),
      folio AS (
        INSERT INTO contador_folio (nombre, valor)
        SELECT 'pedidos', 1 FROM valido
        ON CONFLICT (nombre) DO UPDATE SET valor = contador_folio.valor + 1
        RETURNING valor
      ),
      nuevo AS (
        INSERT INTO pedido (id, folio, monto_total, estado, fecha_creacion,
                            recoger_a, notas, es_credito, usuario_id, cafeteria_id,
                            referencia_pago)
        SELECT $2::uuid, folio.valor, (SELECT sum(precio * cantidad) FROM lineas),
               'por_pagar', now(), $4::timestamptz, nullif(trim($5::text), ''),
               false, cliente.usuario_id, $3::uuid,
               'AGU-' || lpad(folio.valor::text, 5, '0')
        FROM folio, cliente
        RETURNING id
      )
    INSERT INTO detalle_pedido (id, cantidad, precio_en_el_momento, pedido_id, producto_id)
    SELECT gen_random_uuid(), lineas.cantidad, lineas.precio, nuevo.id, lineas.producto_id
    FROM lineas, nuevo
    """
    params: [{ _expr: "auth.uid" }, $id, $cafeteriaId, $recogerA, $notas, $items]
  )
}

# Operaciones de administrador (firebase dataconnect:execute o Admin SDK).
mutation CrearCafeteria($nombre: String!, $ubicacion: String) @auth(level: NO_ACCESS) {
  cafeteria_insert(data: { nombre: $nombre, ubicacion: $ubicacion })
}

mutation CrearPuesto($nombre: String!, $cafeteriaId: UUID!) @auth(level: NO_ACCESS) {
  puesto_insert(data: { nombre: $nombre, cafeteria: { id: $cafeteriaId } })
}

# Asigna un rol y su cafetería al usuario con ese correo. Solo desde la consola
# o el Admin SDK; sirve para nombrar al primer admin. Desde la app se usa AsignarRolAdmin.
mutation AsignarRol($correo: String!, $rol: String!, $cafeteriaId: UUID)
  @auth(level: NO_ACCESS)
  @transaction {
  query @redact {
    autenticacions(where: { correoElectronico: { eq: $correo } }, limit: 1)
      @check(expr: "this.size() == 1", message: "No hay un usuario con ese correo") {
      usuario {
        id
      }
    }
    rols(where: { nombre: { eq: $rol } }, limit: 1)
      @check(expr: "this.size() == 1", message: "Rol desconocido") {
      id
    }
  }
  usuario_update(
    key: { id_expr: "response.query.autenticacions[0].usuario.id" }
    data: {
      rolId_expr: "response.query.rols[0].id"
      cafeteria: { id: $cafeteriaId }
    }
  )
}

mutation CrearProducto(
  $nombre: String!
  $precio: Float!
  $cantidadEnStock: Int!
  $categoria: String!
  $descripcion: String
  $urlDeImagen: String
  $puestoId: UUID!
) @auth(level: NO_ACCESS) {
  producto_insert(
    data: {
      nombre: $nombre
      precio: $precio
      cantidadEnStock: $cantidadEnStock
      categoria: $categoria
      descripcion: $descripcion
      urlDeImagen: $urlDeImagen
      puesto: { id: $puestoId }
    }
  )
}

# HU-18: el encargado administra las estaciones de su propia cafetería.
mutation CrearEstacion($nombre: String!, $orden: Int!) @auth(level: USER) @transaction {
  query @redact {
    autenticacion(key: { firebaseAuthUid_expr: "auth.uid" })
      @check(expr: "this != null", message: "No tienes perfil") {
      usuario {
        rol @check(expr: "this != null && this.nombre == 'encargado'", message: "Solo el encargado puede hacer esto") {
          nombre
        }
        cafeteria @check(expr: "this != null", message: "No tienes cafetería asignada") {
          id
        }
      }
    }
  }
  puesto_insert(
    data: {
      nombre: $nombre
      orden: $orden
      cafeteriaId_expr: "response.query.autenticacion.usuario.cafeteria.id"
    }
  )
}

mutation EditarEstacion($id: UUID!, $nombre: String!, $orden: Int!, $activo: Boolean!)
  @auth(level: USER)
  @transaction {
  puesto_update(
    first: {
      where: {
        id: { eq: $id }
        cafeteria: {
          usuarios_on_cafeteria: {
            exist: {
              rol: { nombre: { eq: "encargado" } }
              autenticacion_on_usuario: { firebaseAuthUid: { eq_expr: "auth.uid" } }
            }
          }
        }
      }
    }
    data: { nombre: $nombre, orden: $orden, activo: $activo }
  ) @check(expr: "this != null", message: "La estación no es de tu cafetería")
}

mutation EliminarEstacion($id: UUID!) @auth(level: USER) @transaction {
  query @redact {
    puesto(id: $id) @check(expr: "this != null", message: "La estación no existe") {
      productos_on_puesto(where: { eliminado: { eq: false } })
        @check(expr: "this.size() == 0", message: "La estación tiene productos: desactívala en lugar de borrarla") {
        id
      }
    }
  }
  puesto_delete(
    first: {
      where: {
        id: { eq: $id }
        cafeteria: {
          usuarios_on_cafeteria: {
            exist: {
              rol: { nombre: { eq: "encargado" } }
              autenticacion_on_usuario: { firebaseAuthUid: { eq_expr: "auth.uid" } }
            }
          }
        }
      }
    }
  ) @check(expr: "this != null", message: "La estación no es de tu cafetería")
}

# HU-13: el encargado registra un producto en una estación de su cafetería.
# El servidor valida nombre y precio aunque la app ya lo haga.
mutation CrearMiProducto(
  $nombre: String!
  $descripcion: String
  $precio: Float!
  $puestoId: UUID!
  $disponible: Boolean!
  $preparacionInmediata: Boolean
) @auth(level: USER) @transaction {
  query @redact {
    puesto(id: $puestoId)
      @check(expr: "this != null", message: "Elige una estación")
      @check(expr: "vars.nombre.trim().size() > 0", message: "El nombre es obligatorio")
      @check(expr: "vars.precio > 0.0", message: "El precio debe ser mayor a 0") {
      cafeteria {
        usuarios_on_cafeteria(
          where: {
            rol: { nombre: { eq: "encargado" } }
            autenticacion_on_usuario: { firebaseAuthUid: { eq_expr: "auth.uid" } }
          }
        ) @check(expr: "this.size() == 1", message: "La estación no es de tu cafetería") {
          id
        }
      }
    }
  }
  producto_insert(
    data: {
      nombre: $nombre
      descripcion: $descripcion
      precio: $precio
      preparacionInmediata: $preparacionInmediata
      disponible: $disponible
      puesto: { id: $puestoId }
    }
  )
}

# HU-15: editar un producto propio. La nueva estación debe ser de la misma
# cafetería; los pedidos anteriores conservan su precio en DetallePedido.
mutation EditarMiProducto(
  $id: UUID!
  $nombre: String!
  $descripcion: String
  $precio: Float!
  $puestoId: UUID!
  $disponible: Boolean!
  $preparacionInmediata: Boolean
) @auth(level: USER) @transaction {
  query @redact {
    producto(id: $id)
      @check(expr: "this != null", message: "El producto no existe")
      @check(expr: "vars.nombre.trim().size() > 0", message: "El nombre es obligatorio")
      @check(expr: "vars.precio > 0.0", message: "El precio debe ser mayor a 0") {
      puesto {
        cafeteria {
          usuarios_on_cafeteria(
            where: {
              rol: { nombre: { eq: "encargado" } }
              autenticacion_on_usuario: { firebaseAuthUid: { eq_expr: "auth.uid" } }
            }
          ) @check(expr: "this.size() == 1", message: "El producto no es de tu cafetería") {
            id
          }
        }
      }
    }
    puesto(id: $puestoId) @check(expr: "this != null", message: "Elige una estación") {
      cafeteria {
        usuarios_on_cafeteria(
          where: {
            rol: { nombre: { eq: "encargado" } }
            autenticacion_on_usuario: { firebaseAuthUid: { eq_expr: "auth.uid" } }
          }
        ) @check(expr: "this.size() == 1", message: "La estación no es de tu cafetería") {
          id
        }
      }
    }
  }
  producto_update(
    id: $id
    data: {
      nombre: $nombre
      descripcion: $descripcion
      precio: $precio
      preparacionInmediata: $preparacionInmediata
      disponible: $disponible
      puesto: { id: $puestoId }
    }
  )
}

# HU-16: marcar un producto agotado o disponible desde la lista.
# La función cancelarAlAgotar (functions/) cancela los pedidos pendientes que lo incluyen.
mutation EstablecerDisponibilidad($id: UUID!, $disponible: Boolean!)
  @auth(level: USER)
  @transaction {
  producto_update(
    first: {
      where: {
        id: { eq: $id }
        puesto: {
          cafeteria: {
            usuarios_on_cafeteria: {
              exist: {
                rol: { nombre: { eq: "encargado" } }
                autenticacion_on_usuario: { firebaseAuthUid: { eq_expr: "auth.uid" } }
              }
            }
          }
        }
      }
    }
    data: { disponible: $disponible }
  ) @check(expr: "this != null", message: "El producto no es de tu cafetería")
}

# HU-17: eliminar un producto propio. Es un borrado lógico: el producto sale
# del menú y de la lista, pero DetallePedido lo sigue referenciando, así que
# los pedidos anteriores conservan su nombre y precio.
mutation EliminarMiProducto($id: UUID!) @auth(level: USER) @transaction {
  producto_update(
    first: {
      where: {
        id: { eq: $id }
        eliminado: { eq: false }
        puesto: {
          cafeteria: {
            usuarios_on_cafeteria: {
              exist: {
                rol: { nombre: { eq: "encargado" } }
                autenticacion_on_usuario: { firebaseAuthUid: { eq_expr: "auth.uid" } }
              }
            }
          }
        }
      }
    }
    data: { eliminado: true, disponible: false }
  ) @check(expr: "this != null", message: "El producto no es de tu cafetería")
}

# HU-21: destacar un producto propio con precio promocional hasta una fecha.
mutation PublicarOferta(
  $id: UUID!
  $precioOferta: Float!
  $hasta: Timestamp!
  $esEspecialidad: Boolean!
) @auth(level: USER) @transaction {
  query @redact {
    producto(id: $id)
      @check(expr: "this != null", message: "El producto no existe")
      @check(expr: "vars.precioOferta > 0.0", message: "El precio de oferta debe ser mayor a 0")
      @check(expr: "vars.hasta > request.time", message: "La fecha de término ya pasó") {
      precio @check(expr: "vars.precioOferta < this", message: "La oferta debe costar menos que el precio normal")
    }
  }
  producto_update(
    first: {
      where: {
        id: { eq: $id }
        eliminado: { eq: false }
        puesto: {
          cafeteria: {
            usuarios_on_cafeteria: {
              exist: {
                rol: { nombre: { eq: "encargado" } }
                autenticacion_on_usuario: { firebaseAuthUid: { eq_expr: "auth.uid" } }
              }
            }
          }
        }
      }
    }
    data: { precioOferta: $precioOferta, ofertaHasta: $hasta, esEspecialidad: $esEspecialidad }
  ) @check(expr: "this != null", message: "El producto no es de tu cafetería")
}

mutation QuitarOferta($id: UUID!) @auth(level: USER) @transaction {
  producto_update(
    first: {
      where: {
        id: { eq: $id }
        puesto: {
          cafeteria: {
            usuarios_on_cafeteria: {
              exist: {
                rol: { nombre: { eq: "encargado" } }
                autenticacion_on_usuario: { firebaseAuthUid: { eq_expr: "auth.uid" } }
              }
            }
          }
        }
      }
    }
    data: { precioOferta: null, ofertaHasta: null, esEspecialidad: false }
  ) @check(expr: "this != null", message: "El producto no es de tu cafetería")
}

# HU-10: el encargado ajusta horario, anticipación, intervalo y capacidad de su cafetería.
mutation EditarMiCafeteria(
  $aperturaMinutos: Int!
  $cierreMinutos: Int!
  $anticipacionMinutos: Int!
  $intervaloMinutos: Int!
  $capacidadPorFranja: Int!
  $permitirInmediatos: Boolean!
) @auth(level: USER) @transaction {
  query @redact {
    autenticacion(key: { firebaseAuthUid_expr: "auth.uid" })
      @check(expr: "this != null", message: "No tienes perfil")
      @check(expr: "vars.aperturaMinutos >= 0 && vars.cierreMinutos <= 1439 && vars.aperturaMinutos < vars.cierreMinutos", message: "El horario no es válido")
      @check(expr: "vars.anticipacionMinutos >= 0 && vars.anticipacionMinutos <= 240", message: "La anticipación debe estar entre 0 y 240 minutos")
      @check(expr: "vars.intervaloMinutos >= 5 && vars.intervaloMinutos <= 60", message: "El intervalo debe estar entre 5 y 60 minutos")
      @check(expr: "vars.capacidadPorFranja >= 1 && vars.capacidadPorFranja <= 200", message: "La capacidad debe estar entre 1 y 200 pedidos") {
      usuario {
        rol @check(expr: "this != null && this.nombre == 'encargado'", message: "Solo el encargado puede hacer esto") {
          nombre
        }
        cafeteria @check(expr: "this != null", message: "No tienes cafetería asignada") {
          id
        }
      }
    }
  }
  cafeteria_update(
    key: { id_expr: "response.query.autenticacion.usuario.cafeteria.id" }
    data: {
      aperturaMinutos: $aperturaMinutos
      cierreMinutos: $cierreMinutos
      anticipacionMinutos: $anticipacionMinutos
      intervaloMinutos: $intervaloMinutos
      capacidadPorFranja: $capacidadPorFranja
      permitirInmediatos: $permitirInmediatos
    }
  )
}

# HU-06: el encargado o un empleado avanza un pedido de su cafetería un paso a la vez:
# pendiente -> preparando -> listo. Si el pedido ya cambió, no se toca.
mutation AvanzarPedido($id: UUID!, $estado: String!)
  @auth(expr: "vars.estado in ['preparando', 'listo']") {
  _execute(
    sql: """
    UPDATE pedido SET estado = $3
    WHERE id = $2::uuid
      AND estado = CASE $3 WHEN 'preparando' THEN 'pendiente' WHEN 'listo' THEN 'preparando' END
      AND cafeteria_id IN (
        SELECT u.cafeteria_id
        FROM usuario u
        JOIN autenticacion a ON a.usuario_id = u.id
        JOIN rol r ON r.id = u.rol_id
        WHERE a.firebase_auth_uid = $1 AND r.nombre IN ('encargado', 'empleado')
      )
    """
    params: [{ _expr: "auth.uid" }, $id, $estado]
  )
}

# HU-08: el encargado valida el comprobante de transferencia. Al aprobarlo el
# pedido pasa a "pendiente" (entra a cocina); al rechazarlo vuelve a
# "por_pagar" con el motivo para el alumno.
mutation ValidarPago($id: UUID!, $aprobado: Boolean!, $motivo: String)
  @auth(expr: "auth != null && (vars.aprobado || (has(vars.motivo) && vars.motivo.trim().size() > 0))") {
  _execute(
    sql: """
    UPDATE pedido
    SET estado = CASE WHEN $3::boolean THEN 'pendiente' ELSE 'por_pagar' END,
        pagado_en = CASE WHEN $3::boolean THEN now() ELSE NULL END,
        motivo_rechazo_pago = CASE WHEN $3::boolean THEN NULL ELSE nullif(trim($4::text), '') END,
        codigo_entrega = CASE WHEN $3::boolean
                              THEN lpad((floor(random() * 10000))::int::text, 4, '0')
                              ELSE NULL END,
        intentos_entrega = 0
    WHERE id = $2::uuid
      AND estado = 'pago_en_revision'
      AND cafeteria_id IN (
        SELECT u.cafeteria_id
        FROM usuario u
        JOIN autenticacion a ON a.usuario_id = u.id
        JOIN rol r ON r.id = u.rol_id
        WHERE a.firebase_auth_uid = $1 AND r.nombre = 'encargado'
      )
    """
    params: [{ _expr: "auth.uid" }, $id, $aprobado, $motivo]
  )
}

# HU-09: el encargado o un empleado entrega un pedido listo de su cafetería con el código del
# alumno. Un código equivocado suma un intento; con 5 intentos el pedido ya no
# se puede entregar con código. Devuelve el estado y los intentos resultantes.
mutation EntregarPedido($id: UUID!, $codigo: String!) @auth(level: USER) {
  resultado: _executeReturningFirst(
    sql: """
    UPDATE pedido
    SET estado = CASE WHEN codigo_entrega = $3 THEN 'entregado' ELSE estado END,
        entregado_en = CASE WHEN codigo_entrega = $3 THEN now() ELSE entregado_en END,
        intentos_entrega = CASE WHEN codigo_entrega = $3 THEN intentos_entrega
                                ELSE intentos_entrega + 1 END
    WHERE id = $2::uuid
      AND estado = 'listo'
      AND intentos_entrega < 5
      AND cafeteria_id IN (
        SELECT u.cafeteria_id
        FROM usuario u
        JOIN autenticacion a ON a.usuario_id = u.id
        JOIN rol r ON r.id = u.rol_id
        WHERE a.firebase_auth_uid = $1 AND r.nombre IN ('encargado', 'empleado')
      )
    RETURNING estado, intentos_entrega AS "intentos"
    """
    params: [{ _expr: "auth.uid" }, $id, $codigo]
  )
}

# HU-23: el encargado o un empleado registra que el alumno no recogió un pedido listo cuya
# hora ya pasó. Cuenta para el sistema de confianza.
mutation MarcarNoRecogido($id: UUID!) @auth(level: USER) {
  _execute(
    sql: """
    UPDATE pedido SET estado = 'no_recogido'
    WHERE id = $2::uuid
      AND estado = 'listo'
      AND recoger_a < now()
      AND cafeteria_id IN (
        SELECT u.cafeteria_id
        FROM usuario u
        JOIN autenticacion a ON a.usuario_id = u.id
        JOIN rol r ON r.id = u.rol_id
        WHERE a.firebase_auth_uid = $1 AND r.nombre IN ('encargado', 'empleado')
      )
    """
    params: [{ _expr: "auth.uid" }, $id]
  )
}

# HU-05: guarda el token de notificaciones del dispositivo del usuario con sesión.
mutation RegistrarDispositivo($token: String!, $plataforma: String!)
  @auth(expr: "auth != null && vars.plataforma in ['android', 'ios', 'web']")
  @transaction {
  query @redact {
    autenticacion(key: { firebaseAuthUid_expr: "auth.uid" })
      @check(expr: "this != null", message: "No tienes perfil")
      @check(expr: "vars.token.size() > 20 && vars.token.size() < 4096", message: "Token inválido") {
      usuario {
        id
      }
    }
  }
  dispositivoToken_upsert(
    data: {
      token: $token
      plataforma: $plataforma
      actualizado_expr: "request.time"
      usuarioId_expr: "response.query.autenticacion.usuario.id"
    }
  )
}

# HU-05: al cerrar sesión el dispositivo deja de recibir avisos de esa cuenta.
mutation OlvidarDispositivo($token: String!) @auth(level: USER) {
  dispositivoToken_deleteMany(
    where: {
      token: { eq: $token }
      usuario: { autenticacion_on_usuario: { firebaseAuthUid: { eq_expr: "auth.uid" } } }
    }
  )
}

# Mi cuenta: el usuario con sesión cambia su nombre y teléfono.
mutation EditarMiPerfil($nombre: String!, $telefono: String)
  @auth(expr: "auth != null && vars.nombre.trim().size() >= 2 && vars.nombre.size() <= 80 && (!has(vars.telefono) || vars.telefono == null || vars.telefono.matches('^[0-9]{10}$'))")
  @transaction {
  query @redact {
    autenticacion(key: { firebaseAuthUid_expr: "auth.uid" })
      @check(expr: "this != null", message: "No tienes perfil") {
      usuario {
        id
      }
    }
  }
  usuario_update(
    key: { id_expr: "response.query.autenticacion.usuario.id" }
    data: { nombre: $nombre, numeroDeTelefono: $telefono }
  )
}

# Mi cuenta: el alumno borra sus datos personales antes de que la app borre su
# cuenta de Firebase Auth. Sus pedidos se conservan para los reportes, ligados
# a un usuario anónimo ("Cuenta eliminada"). Se rechaza si tiene pedidos en
# curso o si la cuenta tiene un rol del personal: a esas primero se les quita.
mutation EliminarMiCuenta @auth(level: USER) @transaction {
  query @redact {
    autenticacion(key: { firebaseAuthUid_expr: "auth.uid" })
      @check(expr: "this != null", message: "No tienes perfil") {
      usuario {
        id
        rol @check(expr: "this == null || this.nombre == 'alumno'", message: "Las cuentas del personal no se eliminan desde la app") {
          nombre
        }
        pedidos_on_usuario(
          where: { estado: { in: ["por_pagar", "pago_en_revision", "pendiente", "preparando", "listo"] } }
        ) @check(expr: "this.size() == 0", message: "Tienes pedidos en curso: espera a recogerlos o cancélalos") {
          id
        }
      }
    }
  }
  dispositivoToken_deleteMany(
    where: { usuario: { autenticacion_on_usuario: { firebaseAuthUid: { eq_expr: "auth.uid" } } } }
  )
  notificacion_deleteMany(
    where: { usuario: { autenticacion_on_usuario: { firebaseAuthUid: { eq_expr: "auth.uid" } } } }
  )
  solicitudEmpleo_deleteMany(
    where: { usuario: { autenticacion_on_usuario: { firebaseAuthUid: { eq_expr: "auth.uid" } } } }
  )
  usuario_update(
    key: { id_expr: "response.query.autenticacion.usuario.id" }
    data: { nombre: "Cuenta eliminada", numeroDeTelefono: null, direccion: null }
  )
  autenticacion_delete(key: { firebaseAuthUid_expr: "auth.uid" })
}

# Bandeja de avisos: marca como leídos todos los avisos del usuario con sesión.
mutation MarcarAvisosLeidos @auth(level: USER) {
  notificacion_updateMany(
    where: {
      usuario: { autenticacion_on_usuario: { firebaseAuthUid: { eq_expr: "auth.uid" } } }
      leido: { eq: false }
    }
    data: { leido: true }
  )
}

# El alumno cancela su pedido mientras no se empiece a preparar: por pagar,
# con el comprobante en revisión o pagado esperando en cocina. Devuelve si ya
# estaba pagado (la cafetería hace el reembolso), o null si ya no se puede.
mutation CancelarMiPedido($id: UUID!) @auth(level: USER) {
  resultado: _executeReturningFirst(
    sql: """
    UPDATE pedido
    SET estado = 'cancelado', codigo_entrega = NULL
    WHERE id = $2::uuid
      AND estado IN ('por_pagar', 'pago_en_revision', 'pendiente')
      AND usuario_id = (SELECT usuario_id FROM autenticacion WHERE firebase_auth_uid = $1)
    RETURNING (pagado_en IS NOT NULL) AS "pagado"
    """
    params: [{ _expr: "auth.uid" }, $id]
  )
}

# HU-08 con Supabase Storage: el alumno ya subió su comprobante a su carpeta
# (<uid>/...) del bucket privado "comprobantes" y aquí lo liga a su pedido.
# Solo el dueño, solo mientras esté por pagar, y la ruta debe estar en su
# carpeta. Devuelve null si no se cumplió alguna condición.
mutation EnviarComprobante($pedidoId: UUID!, $ruta: String!)
  @auth(expr: "auth != null && vars.ruta.startsWith(auth.uid + '/') && vars.ruta.size() <= 200 && !vars.ruta.contains('..')") {
  resultado: _executeReturningFirst(
    sql: """
    UPDATE pedido
    SET estado = 'pago_en_revision', comprobante_url = $3, motivo_rechazo_pago = NULL
    WHERE id = $2::uuid
      AND estado = 'por_pagar'
      AND usuario_id = (SELECT usuario_id FROM autenticacion WHERE firebase_auth_uid = $1)
    RETURNING estado
    """
    params: [{ _expr: "auth.uid" }, $pedidoId, $ruta]
  )
}

# HU-20 con Supabase Storage: el encargado ya subió la foto al bucket público
# "productos" y aquí la liga a un producto de su cafetería.
mutation GuardarFotoProducto($id: UUID!, $url: String!)
  @auth(expr: "auth != null && vars.url.startsWith('https://') && vars.url.contains('.supabase.co/storage/v1/object/public/productos/' + auth.uid + '/') && vars.url.size() <= 500")
  @transaction {
  producto_update(
    first: {
      where: {
        id: { eq: $id }
        eliminado: { eq: false }
        puesto: {
          cafeteria: {
            usuarios_on_cafeteria: {
              exist: {
                rol: { nombre: { eq: "encargado" } }
                autenticacion_on_usuario: { firebaseAuthUid: { eq_expr: "auth.uid" } }
              }
            }
          }
        }
      }
    }
    data: { urlDeImagen: $url }
  ) @check(expr: "this != null", message: "El producto no es de tu cafetería")
}
